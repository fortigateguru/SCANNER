<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>Room Sentinel</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f5f3;
  --surface: #ffffff;
  --surface2: #f0efed;
  --border: #e8e6e2;
  --border2: #d8d5d0;
  --ink: #1a1916;
  --ink2: #6b6762;
  --ink3: #a8a49f;
  --green: #00a86b;
  --green-bg: #e8f8f2;
  --green-mid: #00c47e;
  --amber: #e08c00;
  --amber-bg: #fef3db;
  --red: #d93025;
  --red-bg: #fce8e6;
  --blue: #1a73e8;
  --blue-bg: #e8f0fe;
  --purple: #7c3aed;
  --purple-bg: #f0ebff;
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
  --radius: 20px;
  --radius-sm: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.07);
  --shadow-md: 0 4px 24px rgba(0,0,0,0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); overscroll-behavior: none; }

body {
  font-family: var(--font);
  color: var(--ink);
  max-width: 480px;
  margin: 0 auto;
  padding: 0 0 100px;
  background: var(--bg);
}

/* ── HEADER ── */
.header {
  background: var(--surface);
  padding: 56px 24px 20px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
}
.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.app-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--ink);
}
.status-chip {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 14px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 500;
  font-family: var(--mono);
  background: var(--surface2);
  color: var(--ink2);
  transition: all 0.3s;
}
.status-chip.active  { background: var(--green-bg);  color: var(--green); }
.status-chip.alert   { background: var(--red-bg);    color: var(--red); animation: chip-pulse 0.5s infinite alternate; }
.status-chip.cal     { background: var(--amber-bg);  color: var(--amber); }
.status-chip.passive { background: var(--blue-bg);   color: var(--blue); }
@keyframes chip-pulse { to { opacity: 0.6; } }
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.app-sub {
  font-size: 14px;
  color: var(--ink3);
  font-weight: 400;
}

/* ── MODE TOGGLE ── */
.mode-toggle {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  margin: 20px 20px 0;
  background: var(--surface2);
  border-radius: var(--radius-sm);
  padding: 4px;
}
.mode-tab {
  padding: 12px 8px;
  text-align: center;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink3);
  border-radius: 9px;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
  border: none;
  background: none;
}
.mode-tab.selected {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow);
}

/* ── MAIN SONAR CARD ── */
.sonar-card {
  margin: 16px 16px 0;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 24px;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  align-items: center;
}
.sonar-wrap {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 8px 0;
}
#sonar-canvas {
  border-radius: 50%;
  display: block;
}
.sonar-overlay {
  position: absolute;
  text-align: center;
  pointer-events: none;
}
.sonar-score {
  font-size: 32px;
  font-weight: 700;
  font-family: var(--mono);
  color: var(--ink);
  line-height: 1;
}
.sonar-score.green  { color: var(--green); }
.sonar-score.amber  { color: var(--amber); }
.sonar-score.red    { color: var(--red); }
.sonar-label {
  font-size: 11px;
  color: var(--ink3);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-top: 4px;
}

/* ── ALERT BANNER ── */
.alert-banner {
  display: none;
  margin: 12px 16px 0;
  background: var(--red-bg);
  border: 1.5px solid #f5c6c3;
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  font-size: 15px;
  font-weight: 500;
  color: var(--red);
  text-align: center;
}
.alert-banner.show { display: block; animation: slide-in 0.3s ease; }
@keyframes slide-in { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }
.alert-banner.ok-b  { background: var(--green-bg); border-color: #b2dfce; color: var(--green); display:block; }
.alert-banner.cal-b { background: var(--amber-bg); border-color: #f5dfa0; color: var(--amber); display:block; }

/* ── METRIC STRIP ── */
.metric-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 12px 16px 0;
}
.metric-card {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 14px 12px;
  box-shadow: var(--shadow);
}
.metric-label {
  font-size: 11px;
  color: var(--ink3);
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.metric-value {
  font-size: 22px;
  font-weight: 700;
  font-family: var(--mono);
  color: var(--ink);
  line-height: 1;
}
.metric-value.green  { color: var(--green); }
.metric-value.amber  { color: var(--amber); }
.metric-value.red    { color: var(--red); }
.metric-bar {
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  margin-top: 8px;
  overflow: hidden;
}
.metric-fill {
  height: 100%;
  background: var(--green);
  border-radius: 2px;
  width: 0%;
  transition: width 0.15s, background 0.2s;
}

/* ── SPECTRUM CARD ── */
.spec-card {
  margin: 12px 16px 0;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}
.card-title {
  font-size: 13px;
  color: var(--ink2);
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 14px;
}
#spec-canvas, #delta-canvas, #wave-canvas, #pband-canvas {
  width: 100%;
  display: block;
  border-radius: 10px;
  background: var(--bg);
}

/* ── PASSIVE BAND CARDS ── */
.band-row {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 12px 16px 0;
}
.band-item {
  background: var(--surface);
  border-radius: var(--radius-sm);
  padding: 14px 18px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 16px;
}
.band-info { flex: 1; }
.band-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 2px;
}
.band-range {
  font-size: 12px;
  color: var(--ink3);
  font-family: var(--mono);
}
.band-right { text-align: right; min-width: 70px; }
.band-sigma {
  font-size: 20px;
  font-weight: 700;
  font-family: var(--mono);
  color: var(--ink2);
}
.band-sigma.warm  { color: var(--amber); }
.band-sigma.hot   { color: var(--red); }
.band-track {
  flex: 2;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.band-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.12s, background 0.2s;
  background: var(--green);
  width: 0%;
}

/* ── CONTROLS SECTION ── */
.controls-card {
  margin: 12px 16px 0;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
}
.slider-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
.slider-row:last-child { margin-bottom: 0; }
.slider-label {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink2);
  min-width: 90px;
}
input[type=range] {
  flex: 1;
  height: 4px;
  accent-color: var(--green);
  cursor: pointer;
}
.slider-val {
  font-size: 14px;
  font-weight: 600;
  font-family: var(--mono);
  color: var(--ink);
  min-width: 56px;
  text-align: right;
}

/* ── BIG BUTTONS ── */
.btn-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 12px 16px 0;
}
.btn-row.single { grid-template-columns: 1fr; }
.big-btn {
  padding: 18px 16px;
  border-radius: var(--radius-sm);
  font-size: 16px;
  font-weight: 600;
  font-family: var(--font);
  border: none;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  box-shadow: var(--shadow);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.big-btn:active { transform: scale(0.97); box-shadow: none; }
.big-btn .btn-icon { font-size: 22px; }
.big-btn .btn-label { font-size: 13px; }

.btn-calibrate { background: var(--ink); color: #fff; }
.btn-calibrate:disabled { background: var(--border); color: var(--ink3); box-shadow: none; }
.btn-scan { background: var(--green); color: #fff; }
.btn-scan:disabled { background: var(--border); color: var(--ink3); box-shadow: none; }
.btn-stop { background: var(--red-bg); color: var(--red); }
.btn-stop:disabled { background: var(--border); color: var(--ink3); box-shadow: none; }
.btn-test { background: var(--amber-bg); color: var(--amber); }
.btn-test:disabled { background: var(--border); color: var(--ink3); box-shadow: none; }

/* ── EVENT LOG ── */
.log-card {
  margin: 12px 16px 0;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  max-height: 200px;
  overflow-y: auto;
}
.log-card::-webkit-scrollbar { width: 3px; }
.log-card::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
.log-entry {
  display: flex;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  align-items: baseline;
}
.log-entry:last-child { border: none; }
.log-time { color: var(--ink3); font-family: var(--mono); font-size: 11px; min-width: 62px; flex-shrink: 0; }
.log-msg { color: var(--ink2); flex: 1; line-height: 1.5; }
.log-entry.ok   .log-msg { color: var(--green); }
.log-entry.warn .log-msg { color: var(--amber); }
.log-entry.alrt .log-msg { color: var(--red); font-weight: 500; }

/* ── PASSIVE HIDDEN / ACTIVE HIDDEN ── */
.passive-section { display: none; }
body.passive-mode .passive-section  { display: block; }
body.passive-mode .active-section   { display: none; }

/* ── EVENTS COUNT BADGE ── */
.events-badge {
  position: fixed;
  bottom: 28px;
  right: 20px;
  background: var(--red);
  color: white;
  width: 52px; height: 52px;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  box-shadow: 0 4px 16px rgba(217,48,37,0.4);
  font-family: var(--mono);
  z-index: 100;
  animation: badge-pop 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.events-badge.show { display: flex; }
@keyframes badge-pop { from { transform: scale(0); } to { transform: scale(1); } }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <span class="app-name">Room Sentinel</span>
    <div class="status-chip" id="status-chip">
      <div class="status-dot"></div>
      <span id="status-label">Offline</span>
    </div>
  </div>
  <div class="app-sub" id="app-sub">Acoustic presence detection</div>
</div>

<!-- MODE TOGGLE -->
<div class="mode-toggle">
  <button class="mode-tab selected" id="tab-passive" onclick="switchMode('passive')">
    🎙 Passive
  </button>
  <button class="mode-tab" id="tab-active" onclick="switchMode('active')">
    📡 Active (Ultrasonic)
  </button>
</div>

<!-- ALERT BANNER -->
<div class="alert-banner" id="banner"></div>

<!-- SONAR CARD (active only) -->
<div class="sonar-card active-section" id="sonar-card">
  <div class="card-title">Sonar Sweep</div>
  <div class="sonar-wrap">
    <canvas id="sonar-canvas" width="260" height="260"></canvas>
    <div class="sonar-overlay">
      <div class="sonar-score" id="sonar-score">—</div>
      <div class="sonar-label">composite Δ</div>
    </div>
  </div>
</div>

<!-- PASSIVE WAVEFORM (passive only) -->
<div class="spec-card passive-section">
  <div class="card-title">Live Microphone</div>
  <canvas id="wave-canvas" width="400" height="80"></canvas>
</div>

<!-- METRIC STRIP (active) -->
<div class="metric-strip active-section">
  <div class="metric-card">
    <div class="metric-label">RMS Δ</div>
    <div class="metric-value" id="m-rms">—</div>
    <div class="metric-bar"><div class="metric-fill" id="b-rms"></div></div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Centroid</div>
    <div class="metric-value" id="m-sc">—</div>
    <div class="metric-bar"><div class="metric-fill" id="b-sc"></div></div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Flux</div>
    <div class="metric-value" id="m-flux">—</div>
    <div class="metric-bar"><div class="metric-fill" id="b-flux"></div></div>
  </div>
</div>

<!-- PASSIVE BAND METERS -->
<div class="band-row passive-section" id="band-row"></div>

<!-- SPECTRUM (active) -->
<div class="spec-card active-section">
  <div class="card-title">Frequency Spectrum</div>
  <canvas id="spec-canvas" width="400" height="120"></canvas>
</div>

<!-- DELTA TIMELINE (active) -->
<div class="spec-card active-section">
  <div class="card-title">Detection Timeline</div>
  <canvas id="delta-canvas" width="400" height="80"></canvas>
</div>

<!-- PASSIVE BAND TIMELINE -->
<div class="spec-card passive-section">
  <div class="card-title">Band Deviation Timeline</div>
  <canvas id="pband-canvas" width="400" height="80"></canvas>
</div>

<!-- PASSIVE METRICS -->
<div class="metric-strip passive-section">
  <div class="metric-card">
    <div class="metric-label">Dominant</div>
    <div class="metric-value" id="pm-dom" style="font-size:14px;color:var(--blue)">—</div>
    <div class="metric-bar"><div class="metric-fill" id="pb-dom" style="background:var(--blue)"></div></div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Deviation</div>
    <div class="metric-value" id="pm-dev">—</div>
    <div class="metric-bar"><div class="metric-fill" id="pb-dev" style="background:var(--blue)"></div></div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Score</div>
    <div class="metric-value" id="pm-comp">—</div>
    <div class="metric-bar"><div class="metric-fill" id="pb-comp"></div></div>
  </div>
</div>

<!-- CONTROLS CARD -->
<div class="controls-card" id="controls-card">
  <div class="slider-row">
    <span class="slider-label">Sensitivity</span>
    <input type="range" id="sl-sens" min="1" max="30" value="8">
    <span class="slider-val" id="sv-sens">8</span>
  </div>
  <div class="slider-row active-section" id="row-freq">
    <span class="slider-label">Pulse Freq</span>
    <input type="range" id="sl-freq" min="15000" max="20000" step="250" value="18500">
    <span class="slider-val" id="sv-freq">18.5k</span>
  </div>
  <div class="slider-row active-section" id="row-vol">
    <span class="slider-label">Volume</span>
    <input type="range" id="sl-vol" min="1" max="10" value="5">
    <span class="slider-val" id="sv-vol">50%</span>
  </div>
</div>

<!-- BUTTONS -->
<div class="btn-row" id="btn-row-main">
  <button class="big-btn btn-calibrate" id="btn-cal" onclick="doCalibrate()">
    <span class="btn-icon">⚙️</span>
    <span class="btn-label">Calibrate</span>
  </button>
  <button class="big-btn btn-scan" id="btn-scan" onclick="doScan()" disabled>
    <span class="btn-icon">🔍</span>
    <span class="btn-label">Start Scan</span>
  </button>
</div>
<div class="btn-row">
  <button class="big-btn btn-test" id="btn-test" onclick="doTest()" disabled>
    <span class="btn-icon">🧪</span>
    <span class="btn-label">Test Alert</span>
  </button>
  <button class="big-btn btn-stop" id="btn-stop" onclick="doStop()" disabled>
    <span class="btn-icon">⏹</span>
    <span class="btn-label">Stop</span>
  </button>
</div>

<!-- LOG -->
<div class="log-card" id="log">
  <div class="log-entry"><span class="log-time">--:--</span><span class="log-msg">Ready. Select mode and calibrate.</span></div>
</div>

<!-- EVENTS BADGE -->
<div class="events-badge" id="events-badge">0</div>

<script>
// ═══════════════════════════════════════
//  CONSTANTS & STATE
// ═══════════════════════════════════════
const FFT = 4096;
const BANDS = [
  { name:'Sub-Bass', lo:20,   hi:200,  color:'#7c3aed' },
  { name:'Bass',     lo:200,  hi:800,  color:'#1a73e8' },
  { name:'Mid',      lo:800,  hi:3000, color:'#00a86b' },
  { name:'High-Mid', lo:3000, hi:8000, color:'#e08c00' },
  { name:'Air',      lo:8000, hi:20000,color:'#d93025' },
];

let audioCtx, analyser, micStream, osc, gainNode;
let appMode = 'passive';
let appState = 'idle';
let activeBaseline = null, passiveBaseline = null;
let prevSpectrum = null, prevBands = null;
let eventCount = 0, alertCooldown = 0;
let sonarAngle = 0, trails = [];
let compLive = 0, pCompLive = 0;
let deltaHist = { rms: new Float32Array(300), sc: new Float32Array(300), flux: new Float32Array(300), comp: new Float32Array(300) };
let bandHist = BANDS.map(() => new Float32Array(300));
let animId, scanTimer;

const $ = id => document.getElementById(id);
const ts = () => new Date().toTimeString().slice(0,5);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

// ═══════════════════════════════════════
//  MODE SWITCH
// ═══════════════════════════════════════
function switchMode(m) {
  if (appState !== 'idle') { addLog('Stop first before switching modes', 'warn'); return; }
  appMode = m;
  document.body.className = m === 'passive' ? 'passive-mode' : '';
  $('tab-passive').className = 'mode-tab' + (m==='passive' ? ' selected' : '');
  $('tab-active').className  = 'mode-tab' + (m==='active'  ? ' selected' : '');
  $('app-sub').textContent = m === 'passive' ? 'Passive — mic only, works on Android' : 'Active — ultrasonic echo detection';
  activeBaseline = null; passiveBaseline = null;
  setStatus('idle');
  addLog('Switched to ' + (m==='passive'?'Passive (mic-only)':'Active (ultrasonic)') + ' mode', 'ok');
  if (m === 'passive') buildBandUI();
}

// ═══════════════════════════════════════
//  BUILD PASSIVE BAND UI
// ═══════════════════════════════════════
function buildBandUI() {
  const row = $('band-row');
  row.innerHTML = '';
  BANDS.forEach((b, i) => {
    row.innerHTML += `
      <div class="band-item">
        <div class="band-info">
          <div class="band-name">${b.name}</div>
          <div class="band-range">${b.lo}–${b.hi} Hz</div>
        </div>
        <div class="band-track"><div class="band-fill" id="bf-${i}" style="background:${b.color}"></div></div>
        <div class="band-right">
          <div class="band-sigma" id="bs-${i}">—</div>
        </div>
      </div>`;
  });
}

// ═══════════════════════════════════════
//  STATUS / UI HELPERS
// ═══════════════════════════════════════
function setStatus(s, msg) {
  const chip = $('status-chip');
  const label = $('status-label');
  const states = {
    idle:      { cls: '',        txt: 'Offline' },
    active:    { cls: 'active',  txt: 'Active'  },
    alert:     { cls: 'alert',   txt: '⚠ Alert' },
    cal:       { cls: 'cal',     txt: 'Calibrating' },
    passive:   { cls: 'passive', txt: 'Listening' },
  };
  const st = states[s] || states.idle;
  chip.className = 'status-chip ' + st.cls;
  label.textContent = msg || st.txt;
}

function setBanner(msg, type) {
  const b = $('banner');
  if (!msg) { b.className = 'alert-banner'; b.textContent = ''; return; }
  b.className = 'alert-banner show ' + (type || '');
  b.textContent = msg;
}

function addLog(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'log-entry ' + type;
  el.innerHTML = `<span class="log-time">${ts()}</span><span class="log-msg">${msg}</span>`;
  $('log').appendChild(el);
  $('log').scrollTop = 9999;
  while ($('log').children.length > 60) $('log').removeChild($('log').firstChild);
}

function setMetric(id, val, pct, color) {
  const el = $(id); if (!el) return;
  if (typeof val === 'number') el.textContent = val < 1 ? val.toFixed(2) : (val < 100 ? val.toFixed(1) : Math.round(val));
  else el.textContent = val;
  const cls = color === 'red' ? 'red' : color === 'amber' ? 'amber' : color === 'green' ? 'green' : '';
  el.className = 'metric-value' + (cls ? ' '+cls : '');
  const bar = id.replace(/^[pm]-/, b => b === 'pm-' ? 'pb-' : 'b-');
  if ($(bar)) {
    $(bar).style.width = clamp(pct * 100, 0, 100) + '%';
    $(bar).style.background = color === 'red' ? 'var(--red)' : color === 'amber' ? 'var(--amber)' : color === 'blue' ? 'var(--blue)' : 'var(--green)';
  }
}

function setBtns(calOn, scanOn, testOn, stopOn) {
  $('btn-cal').disabled  = !calOn;
  $('btn-scan').disabled = !scanOn;
  $('btn-test').disabled = !testOn;
  $('btn-stop').disabled = !stopOn;
}

// ═══════════════════════════════════════
//  AUDIO INIT
// ═══════════════════════════════════════
async function initAudio() {
  if (audioCtx && micStream) return true;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false,
               googEchoCancellation: false, googNoiseSuppression: false, googAutoGainControl: false }
    });
    micStream = stream;
    const src = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = FFT;
    analyser.smoothingTimeConstant = 0.3;
    analyser.minDecibels = -110; analyser.maxDecibels = -10;
    src.connect(analyser);
    addLog(`Mic ready — ${audioCtx.sampleRate}Hz`, 'ok');
    return true;
  } catch(e) {
    addLog('Mic denied: ' + e.message, 'alrt');
    setBanner('⚠ Microphone permission denied');
    return false;
  }
}

function freqToBin(f) { return Math.round(f / (audioCtx.sampleRate / FFT)); }
function getFloat()   { const d = new Float32Array(analyser.frequencyBinCount); analyser.getFloatFrequencyData(d); return d; }

function getBandRMS(sp, lo, hi) {
  const b0 = freqToBin(lo), b1 = freqToBin(hi);
  let s = 0, n = 0;
  for (let i = b0; i < b1 && i < sp.length; i++) { const a = Math.pow(10, sp[i]/20); s += a*a; n++; }
  return n > 0 ? Math.sqrt(s/n) : 0;
}

function getSpectralCentroid(sp, lo, hi) {
  const b0 = freqToBin(lo), b1 = freqToBin(hi);
  let ws = 0, s = 0;
  for (let i = b0; i < b1 && i < sp.length; i++) { const a = Math.pow(10, sp[i]/20), f = i*(audioCtx.sampleRate/FFT); ws += a*f; s += a; }
  return s > 0 ? ws/s : (lo+hi)/2;
}

function getSpectralFlux(sp, prev, lo, hi) {
  if (!prev) return 0;
  const b0 = freqToBin(lo), b1 = freqToBin(hi);
  let f = 0;
  for (let i = b0; i < b1 && i < sp.length; i++) { const d = Math.pow(10,sp[i]/20) - Math.pow(10,prev[i]/20); f += d*d; }
  return Math.sqrt(f / Math.max(1, b1-b0));
}

function startOsc() {
  stopOsc();
  const freq = parseInt($('sl-freq').value), vol = parseInt($('sl-vol').value)/10 * 0.55;
  osc = audioCtx.createOscillator(); gainNode = audioCtx.createGain();
  osc.type = 'sine'; osc.frequency.value = freq; gainNode.gain.value = vol;
  osc.connect(gainNode); gainNode.connect(audioCtx.destination); osc.start();
}

function stopOsc() {
  try { if (osc) osc.stop(); } catch(e) {} osc = null;
  if (gainNode) { gainNode.disconnect(); gainNode = null; }
}

// ═══════════════════════════════════════
//  CALIBRATE
// ═══════════════════════════════════════
async function doCalibrate() {
  if (!await initAudio()) return;
  const isP = appMode === 'passive';
  const calSecs = 6;
  if (!isP) startOsc();
  appState = 'calibrating';
  setStatus('cal');
  setBanner(isP ? `Quiet the room — calibrating ${calSecs}s…` : `Keep still — calibrating ${calSecs}s…`, 'cal-b');
  addLog(isP ? 'Passive calibration started' : `Active calibration at ${($('sl-freq').value/1000).toFixed(2)}kHz`, 'info');
  setBtns(false, false, false, true);

  const freq = isP ? 0 : parseInt($('sl-freq').value);
  const bw = 1200;
  let rmsSamples = [], scSamples = [], bandSamples = BANDS.map(() => []);
  let count = 0, TOTAL = Math.round((calSecs * 1000) / 80);

  const timer = setInterval(() => {
    if (appState !== 'calibrating') { clearInterval(timer); return; }
    const sp = getFloat();
    if (isP) {
      BANDS.forEach((b, i) => bandSamples[i].push(getBandRMS(sp, b.lo, b.hi)));
    } else {
      rmsSamples.push(getBandRMS(sp, freq-bw/2, freq+bw/2));
      scSamples.push(getSpectralCentroid(sp, freq-bw/2, freq+bw/2));
    }
    count++;
    if (count >= TOTAL) {
      clearInterval(timer);
      if (isP) {
        const means = BANDS.map((_, i) => bandSamples[i].reduce((a,b)=>a+b) / bandSamples[i].length);
        const stds  = BANDS.map((_, i) => { const m = means[i]; return Math.sqrt(bandSamples[i].reduce((s,v)=>s+(v-m)**2,0)/bandSamples[i].length); });
        passiveBaseline = { means, stds, floor: means.reduce((a,b)=>a+b)/means.length };
        addLog(`Passive baseline ready — floor=${passiveBaseline.floor.toFixed(6)}`, 'ok');
      } else {
        const rmsBase = rmsSamples.reduce((a,b)=>a+b) / rmsSamples.length;
        const scBase  = scSamples.reduce((a,b)=>a+b) / scSamples.length;
        const rmsStd  = Math.sqrt(rmsSamples.reduce((s,v)=>s+(v-rmsBase)**2,0)/rmsSamples.length);
        const scStd   = Math.sqrt(scSamples.reduce((s,v)=>s+(v-scBase)**2,0)/scSamples.length);
        const bq = Math.max(0, 1-(rmsStd/rmsBase)*10);
        activeBaseline = { rms:rmsBase, sc:scBase, rmsStd, scStd, bw, freq };
        addLog(`Active baseline — quality ${(bq*100).toFixed(0)}%`, bq < 0.25 ? 'warn' : 'ok');
        if (bq < 0.2) addLog('Low quality — disable echo cancellation in Chrome flags', 'warn');
      }
      appState = 'idle'; setBanner(null);
      setStatus(isP ? 'passive' : 'active', 'Ready');
      setBtns(true, true, !isP, false);
      prevSpectrum = null; prevBands = null;
    }
  }, 80);
  startDraw();
}

// ═══════════════════════════════════════
//  SCAN
// ═══════════════════════════════════════
async function doScan() {
  const isP = appMode === 'passive';
  if (isP && !passiveBaseline) { addLog('Calibrate first', 'warn'); return; }
  if (!isP && !activeBaseline) { addLog('Calibrate first', 'warn'); return; }
  if (!await initAudio()) return;
  if (!isP) startOsc();
  appState = 'scanning';
  setStatus(isP ? 'passive' : 'active');
  setBanner(null);
  addLog((isP ? 'Passive listening' : 'Active scanning') + ' started', 'ok');
  setBtns(false, false, !isP, true);
  alertCooldown = 0;

  scanTimer = setInterval(() => {
    if (appState !== 'scanning' && appState !== 'alert') return;
    const sp = getFloat();
    const sens = parseInt($('sl-sens').value);

    if (isP) {
      const bandVals = BANDS.map((b) => getBandRMS(sp, b.lo, b.hi));
      const bandDevs = BANDS.map((_, i) => {
        const std = Math.max(passiveBaseline.stds[i], passiveBaseline.means[i]*0.05);
        return Math.abs(bandVals[i] - passiveBaseline.means[i]) / std;
      });
      const totalDev = bandDevs.reduce((a,b)=>a+b) / BANDS.length;
      const maxDev   = Math.max(...bandDevs);
      const domIdx   = bandDevs.indexOf(maxDev);
      const flux     = prevBands ? Math.sqrt(BANDS.reduce((s,_,i)=>{const d=bandVals[i]-prevBands[i];return s+d*d;},0)/BANDS.length) : 0;
      const fluxN    = flux / (passiveBaseline.floor * 0.5 + 0.0001);
      const comp     = Math.min(1, 0.5*Math.min(totalDev/3,1) + 0.3*Math.min(maxDev/5,1) + 0.2*Math.min(fluxN,1));
      pCompLive = comp;
      prevBands = bandVals.slice();

      BANDS.forEach((_, i) => {
        const pct = Math.min(bandVals[i] / passiveBaseline.means[i], 3) / 3;
        const sigma = bandDevs[i];
        if ($('bf-'+i)) $('bf-'+i).style.width = (pct*100)+'%';
        if ($('bs-'+i)) {
          $('bs-'+i).textContent = sigma.toFixed(1)+'σ';
          $('bs-'+i).className = 'band-sigma' + (sigma>3?' hot':sigma>1.5?' warm':'');
        }
      });

      bandHist.forEach((h, i) => { h.copyWithin(0,1); h[h.length-1] = Math.min(bandDevs[i]/5,1); });
      const threshold = sens*0.003 + 0.05;
      setMetric('pm-dom', BANDS[domIdx].name, maxDev/5, 'blue');
      setMetric('pm-dev', totalDev.toFixed(2)+'σ', totalDev/3, totalDev>2?'red':totalDev>1?'amber':'');
      setMetric('pm-comp', comp.toFixed(2), comp/threshold, comp>threshold?'red':comp>threshold*0.6?'amber':'');
      if (alertCooldown > 0) alertCooldown--;
      if (comp > threshold && alertCooldown === 0) fireAlert(`${BANDS[domIdx].name} band change`, comp, threshold);

    } else {
      const { rms:rmsBase, sc:scBase, rmsStd, scStd, bw, freq } = activeBaseline;
      const rms  = getBandRMS(sp, freq-bw/2, freq+bw/2);
      const rmsDelta = rmsBase > 0 ? Math.abs(rms-rmsBase)/rmsBase : 0;
      const sc   = getSpectralCentroid(sp, freq-bw/2, freq+bw/2);
      const scDelta = scStd > 0 ? Math.abs(sc-scBase)/(scStd*10+1) : 0;
      const flux = getSpectralFlux(sp, prevSpectrum, freq-bw/2, freq+bw/2);
      const fluxN = flux / (0.0005 + rmsStd*5);
      const comp = 0.2*rmsDelta + 0.45*Math.min(scDelta,1) + 0.35*Math.min(fluxN,1);
      compLive = comp;
      prevSpectrum = Array.from(sp);
      ['rms','sc','flux','comp'].forEach(k => deltaHist[k].copyWithin(0,1));
      deltaHist.rms[deltaHist.rms.length-1]  = rmsDelta;
      deltaHist.sc[deltaHist.sc.length-1]    = Math.min(scDelta,1);
      deltaHist.flux[deltaHist.flux.length-1]= Math.min(fluxN,1);
      deltaHist.comp[deltaHist.comp.length-1]= comp;
      const threshold = sens*0.004 + 0.01;
      const lvl = comp>threshold*1.5?'red':comp>threshold*0.7?'amber':'';
      setMetric('m-rms',  rmsDelta,  rmsDelta/0.3,  rmsDelta>0.15?'red':rmsDelta>0.08?'amber':'');
      setMetric('m-sc',   scDelta,   scDelta/2,     scDelta>0.8?'red':scDelta>0.4?'amber':'');
      setMetric('m-flux', fluxN,     fluxN/2,       fluxN>0.8?'red':fluxN>0.4?'amber':'');
      // update sonar score
      const sc2 = $('sonar-score');
      sc2.textContent = (comp*100).toFixed(0)+'%';
      sc2.className = 'sonar-score' + (comp>threshold*1.5?' red':comp>threshold*0.7?' amber':' green');
      if (alertCooldown > 0) alertCooldown--;
      if (comp > threshold && alertCooldown === 0) {
        trails.push({ angle: sonarAngle, intensity: Math.min(1, comp/threshold*0.5), born: Date.now() });
        fireAlert('Echo change detected', comp, threshold);
      }
    }
  }, 80);
  startDraw();
}

function fireAlert(what, comp, threshold) {
  eventCount++;
  alertCooldown = 25;
  const mag = comp > threshold*3 ? 'STRONG' : comp > threshold*1.8 ? 'MODERATE' : 'WEAK';
  addLog(`${mag} — ${what}`, 'alrt');
  appState = 'alert';
  setStatus('alert');
  setBanner(`⚠ ${what.toUpperCase()} (${mag})`);
  const badge = $('events-badge');
  badge.textContent = eventCount;
  badge.className = 'events-badge show';
  if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  setTimeout(() => {
    if (appState === 'alert') {
      appState = 'scanning';
      setStatus(appMode === 'passive' ? 'passive' : 'active');
      setBanner(null);
    }
  }, 3000);
}

function doTest() {
  if (!activeBaseline) return;
  const fc = parseFloat($('sl-sens').value) * 0.008;
  deltaHist.comp.copyWithin(0,1); deltaHist.comp[deltaHist.comp.length-1] = fc;
  compLive = fc;
  trails.push({ angle: sonarAngle, intensity: 1, born: Date.now() });
  fireAlert('Test alert triggered', fc, 0.001);
}

function doStop() {
  appState = 'idle'; stopOsc();
  if (scanTimer) clearInterval(scanTimer);
  if (animId) cancelAnimationFrame(animId);
  setStatus('idle'); setBanner(null);
  setBtns(true, !!(appMode==='passive'?passiveBaseline:activeBaseline), appMode==='active'&&!!activeBaseline, false);
  prevSpectrum = null; prevBands = null;
  addLog('Stopped', 'info');
}

// ═══════════════════════════════════════
//  SLIDERS
// ═══════════════════════════════════════
$('sl-sens').oninput = function() { $('sv-sens').textContent = this.value; };
$('sl-freq').oninput = function() { $('sv-freq').textContent = (this.value/1000).toFixed(1)+'k'; if(osc) osc.frequency.value=parseInt(this.value); };
$('sl-vol').oninput  = function() { $('sv-vol').textContent  = (this.value*10)+'%'; if(gainNode) gainNode.gain.value=parseInt(this.value)/10*0.55; };

// ═══════════════════════════════════════
//  DRAWING
// ═══════════════════════════════════════
function startDraw() { if (animId) cancelAnimationFrame(animId); drawLoop(); }
function drawLoop()  { drawAll(); animId = requestAnimationFrame(drawLoop); }

function drawAll() {
  if (appMode === 'active') { drawSonar(); drawSpectrum(); drawDelta(); }
  else { drawWave(); drawBandTimeline(); }
}

function drawSonar() {
  const c = $('sonar-canvas'), g = c.getContext('2d'), W = c.width, H = c.height, cx = W/2, cy = H/2, R = cx-8;
  g.clearRect(0,0,W,H);
  // white bg
  g.fillStyle = '#fff'; g.beginPath(); g.arc(cx,cy,cx,0,Math.PI*2); g.fill();
  // grid
  g.strokeStyle = '#e8e6e2'; g.lineWidth = 0.8;
  [0.25,0.5,0.75,1].forEach(f => { g.beginPath(); g.arc(cx,cy,R*f,0,Math.PI*2); g.stroke(); });
  for (let a=0; a<360; a+=30) { const r=a*Math.PI/180; g.beginPath(); g.moveTo(cx,cy); g.lineTo(cx+Math.cos(r)*R,cy+Math.sin(r)*R); g.stroke(); }
  // trails
  trails = trails.filter(t => Date.now()-t.born < 4000);
  trails.forEach(t => {
    const age = (Date.now()-t.born)/4000, alpha = (1-age)*t.intensity*0.7;
    const r = R*(0.2+t.intensity*0.7), x = cx+Math.cos(t.angle)*r, y = cy+Math.sin(t.angle)*r;
    const gr = g.createRadialGradient(x,y,0,x,y,22);
    gr.addColorStop(0, `rgba(217,48,37,${alpha})`); gr.addColorStop(1,'rgba(217,48,37,0)');
    g.beginPath(); g.arc(x,y,22,0,Math.PI*2); g.fillStyle=gr; g.fill();
  });
  // sweep
  if (appState !== 'idle') {
    sonarAngle += 0.03;
    for (let i=0; i<60; i++) {
      const a = sonarAngle-(i/60)*(Math.PI/2), alpha = (1-i/60)*0.12;
      const col = appState==='calibrating' ? `rgba(224,140,0,${alpha})` : appState==='alert' ? `rgba(217,48,37,${alpha})` : `rgba(0,168,107,${alpha})`;
      g.beginPath(); g.moveTo(cx,cy); g.arc(cx,cy,R,a,a+0.055); g.closePath(); g.fillStyle=col; g.fill();
    }
    const lx=cx+Math.cos(sonarAngle)*R, ly=cy+Math.sin(sonarAngle)*R;
    g.beginPath(); g.moveTo(cx,cy); g.lineTo(lx,ly);
    g.strokeStyle = appState==='calibrating'?'rgba(224,140,0,.8)':appState==='alert'?'rgba(217,48,37,.8)':'rgba(0,168,107,.8)';
    g.lineWidth=2; g.stroke();
  }
  // live ring
  if (appState==='scanning'||appState==='alert') {
    const sens = parseInt($('sl-sens').value), threshold = sens*0.004+0.01;
    const norm = Math.min(compLive/(threshold*1.5),1);
    const ringR = R*(0.1+norm*0.6);
    g.beginPath(); g.arc(cx,cy,ringR,0,Math.PI*2);
    g.strokeStyle = norm>.85?'rgba(217,48,37,0.5)':norm>.5?'rgba(224,140,0,0.5)':'rgba(0,168,107,0.3)';
    g.lineWidth = 1+norm*3; g.stroke();
  }
  // center
  g.fillStyle='#1a1916'; g.beginPath(); g.arc(cx,cy,4,0,Math.PI*2); g.fill();
  g.fillStyle='#a8a49f'; g.font='11px DM Mono';
  ['N','E','S','W'].forEach((l,i) => {
    const a=i*Math.PI/2-Math.PI/2;
    g.fillText(l, cx+Math.cos(a)*(R+12)-4, cy+Math.sin(a)*(R+12)+4);
  });
}

function drawSpectrum() {
  if (!analyser) return;
  const c=$('spec-canvas'), g=c.getContext('2d'), W=c.width, H=c.height;
  g.clearRect(0,0,W,H); g.fillStyle='#f5f5f3'; g.fillRect(0,0,W,H);
  const freq=parseInt($('sl-freq').value), showBins=120, targetBin=freqToBin(freq), startBin=Math.max(0,targetBin-showBins/2);
  const data=new Uint8Array(analyser.frequencyBinCount); analyser.getByteFrequencyData(data);
  const bw=W/showBins;
  for (let i=0; i<showBins; i++) {
    const bin=startBin+i, v=bin<data.length?data[bin]/255:0, h=v*H, isT=Math.abs(bin-targetBin)<5;
    g.fillStyle = isT ? (v>.05?'#d93025':'#00a86b') : `rgba(0,${Math.floor(120*v+60)},${Math.floor(80*v+100)},0.7)`;
    g.fillRect(i*bw, H-h, bw-1, h);
  }
  const mx=(showBins/2)*bw;
  g.strokeStyle='rgba(217,48,37,0.5)'; g.lineWidth=1; g.setLineDash([3,3]);
  g.beginPath(); g.moveTo(mx,0); g.lineTo(mx,H); g.stroke(); g.setLineDash([]);
  g.fillStyle='#6b6762'; g.font='10px DM Mono'; g.fillText((freq/1000).toFixed(2)+'kHz',mx+4,12);
}

function drawDelta() {
  const c=$('delta-canvas'), g=c.getContext('2d'), W=c.width, H=c.height;
  g.clearRect(0,0,W,H); g.fillStyle='#f5f5f3'; g.fillRect(0,0,W,H);
  const threshold=(parseInt($('sl-sens').value))*0.004+0.01, thY=H-(threshold/.2)*H;
  g.strokeStyle='rgba(224,140,0,0.3)'; g.lineWidth=.5; g.setLineDash([4,4]);
  if(thY>0&&thY<H){g.beginPath();g.moveTo(0,thY);g.lineTo(W,thY);g.stroke();} g.setLineDash([]);
  g.fillStyle='rgba(217,48,37,0.04)'; g.fillRect(0,0,W,Math.min(H,thY));
  [{k:'rms',c:'rgba(26,115,232,.6)'},{k:'sc',c:'rgba(0,168,107,.6)'},{k:'flux',c:'rgba(224,140,0,.5)'},{k:'comp',c:'rgba(26,26,22,.85)'}].forEach(({k,c})=>{
    const h=deltaHist[k]; g.beginPath();
    for(let i=0;i<h.length;i++){const x=(i/h.length)*W,y=H-clamp(h[i]/.2,0,1)*H; i===0?g.moveTo(x,y):g.lineTo(x,y);}
    g.strokeStyle=c; g.lineWidth=k==='comp'?2:1; g.stroke();
  });
}

function drawWave() {
  if (!analyser) return;
  const c=$('wave-canvas'), g=c.getContext('2d'), W=c.width, H=c.height;
  g.clearRect(0,0,W,H); g.fillStyle='#f5f5f3'; g.fillRect(0,0,W,H);
  const td=new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(td);
  g.beginPath();
  const col = appState==='alert'?'rgba(217,48,37,.9)':appState==='scanning'?'rgba(26,115,232,.7)':'rgba(168,164,159,.5)';
  g.strokeStyle=col; g.lineWidth=1.8;
  for(let i=0;i<td.length;i+=4){const x=(i/td.length)*W,y=(td[i]/255)*H; i===0?g.moveTo(x,y):g.lineTo(x,y);}
  g.stroke();
  g.strokeStyle='rgba(168,164,159,.2)'; g.lineWidth=.5;
  g.beginPath(); g.moveTo(0,H/2); g.lineTo(W,H/2); g.stroke();
}

function drawBandTimeline() {
  const c=$('pband-canvas'), g=c.getContext('2d'), W=c.width, H=c.height;
  g.clearRect(0,0,W,H); g.fillStyle='#f5f5f3'; g.fillRect(0,0,W,H);
  if(appState==='idle') return;
  const threshold=(parseInt($('sl-sens').value))*0.003+0.05, thY=H-threshold*H;
  g.strokeStyle='rgba(224,140,0,.3)'; g.lineWidth=.5; g.setLineDash([4,4]);
  if(thY>0&&thY<H){g.beginPath();g.moveTo(0,thY);g.lineTo(W,thY);g.stroke();} g.setLineDash([]);
  const colors=['rgba(124,58,237,.6)','rgba(26,115,232,.6)','rgba(0,168,107,.6)','rgba(224,140,0,.6)','rgba(217,48,37,.6)'];
  bandHist.forEach((h,i)=>{
    g.beginPath();
    for(let j=0;j<h.length;j++){const x=(j/h.length)*W,y=H-clamp(h[j],0,1)*H; j===0?g.moveTo(x,y):g.lineTo(x,y);}
    g.strokeStyle=colors[i]; g.lineWidth=1; g.stroke();
  });
}

// Init
buildBandUI();
switchMode('passive');
</script>
